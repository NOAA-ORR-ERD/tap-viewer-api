build_api:
    stage: build
    script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - docker build -f dockerfile . -t registry.orr.noaa.gov/gnome/tap/tap-viewer
        - docker push registry.orr.noaa.gov/gnome/tap/tap-viewer
    tags:
        - shell
        - build
    only:
        - master

staging:
    stage: deploy
    variables:
        TAP_COMMIT_TAG: $CI_COMMIT_TAG
    trigger: gnome/tap/tap-deploy
    only:
        - master


