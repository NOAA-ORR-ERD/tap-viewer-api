variables:
  PYTHON_VER: '3.11'

stages:
    - test
    - build
    - deploy

test_develop:
  stage: test
  #image: registry.orr.noaa.gov/erd/centos-conda/miniforge-python$PYTHON_VER
  image: registry.orr.noaa.gov/erd/centos-conda/miniconda3-python$PYTHON_VER
  #image: registry.orr.noaa.gov/erd/centos-conda/centos7-python3

    # variables:
    #     HASH: '1e0de0123b0043031000b050bb7095a9b4f0015f'
    #     LOCATION_IMAGE_PATH: registry.orr.noaa.gov/gnome/tap/locations/master:$HASH
    ##     GIT_STRATEGY: none

  script:
    - cd TAP-Viewer-API
    - conda install --file conda_requirements.txt
    - conda install --file conda_requirements_test.txt
    # - pip install -r pip_requirements.txt
    - pip install -e ./

    ####
    # get locations/arctic_platforms for tests (this hardcoded in test_cube_crunching.py at this moment)
    ####
    # get metadate from 'locations' repository and clone the root directory only
    - cd tap_viewer_api
    - git --version
    - git clone -v --filter=blob:none --sparse https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.orr.noaa.gov/gnome/tap/locations.git
    # checkout arctic_platforms directory
    - cd locations
    - git sparse-checkout add arctic_platforms
    ####

    # run tests
    - cd ../..
    - pytest tap_viewer_api/test
        
build_api:
    stage: build
    script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - docker build -f dockerfile . -t registry.orr.noaa.gov/gnome/tap/tap-viewer
        - docker push registry.orr.noaa.gov/gnome/tap/tap-viewer
    tags:
        - shell
        - build
    only:
        - master

staging:
    stage: deploy
    variables:
        TAP_COMMIT_TAG: $CI_COMMIT_TAG
    trigger: gnome/tap/tap-deploy
    only:
        - master


